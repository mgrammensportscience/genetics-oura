<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genotype vs Phenotype</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #edeae3;
      font-family: 'Inter', sans-serif;
      color: #1a1a1a;
      font-size: 14px;
    }

    .app-header {
      background: white;
      border-bottom: 1px solid #ddd;
      padding: 16px 28px;
    }

    .header-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: #c0392b;
      margin-bottom: 4px;
    }

    h1 {
      font-size: 22px;
      font-weight: 800;
      color: #1a1a1a;
    }

    .header-sub {
      font-size: 12px;
      color: #888;
      margin-top: 2px;
    }

    .app-body {
      display: flex;
      height: calc(100vh - 72px);
    }

    .left-panel {
      width: 300px;
      background: white;
      border-right: 1px solid #ddd;
      padding: 20px;
      overflow-y: auto;
      flex-shrink: 0;
    }

    .right-panel {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
    }

    .section-title {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: #888;
      margin-bottom: 14px;
    }

    .input-group {
      margin-bottom: 14px;
    }

    .input-group label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #555;
      margin-bottom: 5px;
    }

    .input-group select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: white;
      font-size: 13px;
      color: #1a1a1a;
      appearance: none;
    }

    .analyze-btn {
      width: 100%;
      margin-top: 10px;
      padding: 11px;
      background: #c0392b;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.04em;
    }

    .analyze-btn:hover { background: #a93226; }

    .tiles-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .tile {
      background: white;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 20px;
    }

    .tile-dark {
      background: #1a1a1a;
      border-color: #1a1a1a;
      color: white;
    }

    .tile-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: #888;
      margin-bottom: 10px;
    }

    .tile-dark .tile-label { color: #aaa; }

    .tile-value {
      font-size: 36px;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 6px;
    }

    .tile-unit {
      font-size: 16px;
      font-weight: 500;
      color: #888;
    }

    .tile-accent { color: #c0392b; }

    .tile-sub { font-size: 11px; color: #888; }
    .tile-dark .tile-sub { color: #777; }

    .chart-card {
      background: white;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 20px;
    }

    .chart-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .chart-sub {
      font-size: 11px;
      color: #888;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

<div class="app">
  <header class="app-header">
    <div class="header-label">GENETICS LAB</div>
    <h1>Genotype vs Phenotype Analyzer</h1>
    <p class="header-sub">by Maria Grammenou</p>
  </header>

  <div class="app-body">
    <aside class="left-panel">
      <div class="section-title">GENETIC PROFILE</div>

      <div class="input-group">
        <label>Deep sleep capacity</label>
        <select id="g-deep-sleep">
          <option value="challenge">Challenge</option>
          <option value="typical" selected>Typical</option>
          <option value="advantage">Advantage</option>
        </select>
      </div>

      <div class="input-group">
        <label>Chronotype</label>
        <select id="g-chronotype">
          <option value="evening">Evening owl</option>
          <option value="intermediate" selected>Intermediate</option>
          <option value="morning">Morning lark</option>
        </select>
      </div>

      <div class="input-group">
        <label>HRV potential</label>
        <select id="g-hrv">
          <option value="challenge">Challenge</option>
          <option value="typical" selected>Typical</option>
          <option value="advantage">Advantage</option>
        </select>
      </div>

      <div class="input-group">
        <label>Cortisol reactivity</label>
        <select id="g-cortisol">
          <option value="high">High</option>
          <option value="moderate" selected>Moderate</option>
          <option value="low">Low</option>
        </select>
      </div>

      <button class="analyze-btn" onclick="analyze()">Analyze →</button>
    </aside>

    <main class="right-panel">
      <div class="tiles-row">
        <div class="tile tile-dark">
          <div class="tile-label">PREDICTED DEEP SLEEP</div>
          <div class="tile-value" id="tile-sleep">75 <span class="tile-unit">min</span></div>
          <div class="tile-sub">based on your genetics</div>
        </div>
        <div class="tile">
          <div class="tile-label">PREDICTED HRV</div>
          <div class="tile-value tile-accent" id="tile-hrv">53 <span class="tile-unit">ms</span></div>
          <div class="tile-sub">RMSSD · genetic range</div>
        </div>
        <div class="tile">
          <div class="tile-label">STRESS PROFILE</div>
          <div class="tile-value" id="tile-stress">Moderate</div>
          <div class="tile-sub">cortisol reactivity</div>
        </div>
      </div>

      <div class="chart-card">
        <div class="chart-title">HRV Trend — Genetic range vs your data</div>
        <div class="chart-sub">Last 30 days · RMSSD (ms)</div>
        <canvas id="hrv-chart"></canvas>
      </div>
    </main>
  </div>
</div>

<script>
  function analyze() {
    const deepSleep = document.getElementById('g-deep-sleep').value;
    const hrv       = document.getElementById('g-hrv').value;
    const cortisol  = document.getElementById('g-cortisol').value;

    const deepSleepMap = { challenge: 52, typical: 75, advantage: 98 };
    const hrvMap       = { challenge: 32, typical: 53, advantage: 74 };
    const cortisolMap  = { high: 'High', moderate: 'Moderate', low: 'Low' };

    document.getElementById('tile-sleep').innerHTML =
      deepSleepMap[deepSleep] + ' <span class="tile-unit">min</span>';
    document.getElementById('tile-hrv').innerHTML =
      hrvMap[hrv] + ' <span class="tile-unit">ms</span>';
    document.getElementById('tile-stress').textContent =
      cortisolMap[cortisol];
  }

  // Chart
  const labels = [];
  const actualHRV = [];
  for (let i = 29; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    labels.push(d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }));
    actualHRV.push(Math.round(45 + Math.sin(i / 5) * 8 + (Math.random() - 0.5) * 6));
  }

  new Chart(document.getElementById('hrv-chart'), {
    type: 'line',
    data: {
      labels: labels,
      datasets: [
        {
          label: 'Genetic upper range',
          data: labels.map(() => 68),
          borderColor: 'rgba(100,149,237,0.4)',
          borderDash: [4, 3],
          borderWidth: 1,
          pointRadius: 0,
          fill: '+1',
          backgroundColor: 'rgba(100,149,237,0.08)'
        },
        {
          label: 'Genetic lower range',
          data: labels.map(() => 38),
          borderColor: 'rgba(100,149,237,0.4)',
          borderDash: [4, 3],
          borderWidth: 1,
          pointRadius: 0,
          fill: false
        },
        {
          label: 'Your HRV',
          data: actualHRV,
          borderColor: '#c0392b',
          backgroundColor: 'rgba(192,57,43,0.06)',
          borderWidth: 2,
          pointRadius: 3,
          pointHoverRadius: 5,
          tension: 0.3,
          fill: false
        }
      ]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { position: 'bottom', labels: { font: { size: 11 } } }
      },
      scales: {
        x: { ticks: { maxTicksLimit: 8, font: { size: 10 } } },
        y: { min: 0, ticks: { font: { size: 10 } } }
      }
    }
  });
</script>
</body>
</html>
